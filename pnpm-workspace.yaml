# Used only in github.com/nomideusz/svelte-notify (not the asini monorepo).
# pnpm 10+ blocks lifecycle scripts until approved; esbuild needs its postinstall.
packages:
  - '.'
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@nomideusz/svelte-i18n@0.4.0'
  - '@nomideusz/svelte-qr@0.4.0'
